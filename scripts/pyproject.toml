[project]
name = "info-extract"
version = "0.1.0"
description = "信息抽取技能：音频转录（阶段一）+ OCR/视频/画面（规划中）；本地优先、按需载入、可插拔 Provider"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "av>=11.0",                 # PyAV：自带 ffmpeg 解码，零系统依赖
    "faster-whisper>=1.0",      # 默认本地转录 provider（CTranslate2，离线）
]

[tool.uv]
package = false
